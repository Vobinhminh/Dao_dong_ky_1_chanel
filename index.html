<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao động ký (Oscilloscope) - Sóng âm</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f4f8;
            color: #333;
            font-family: sans-serif;
            margin: 0;
            padding: 10px 15px;
        }
        h2 {
            margin: 10px 0 15px 0;
            font-size: 1.5rem;
        }
        canvas {
            background-color: #e6f7ff; 
            border: 3px solid #000;
            width: 100%;
            max-width: 1200px;
            height: 60vh; 
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #pauseButton {
            background-color: #28a745; 
        }
        #pauseButton:hover { filter: brightness(0.9); }

        @media (orientation: landscape) {
            body { padding: 5px 15px; }
            h2 { display: none; } 
            .controls-wrapper {
                flex-direction: row; 
                justify-content: center;
            }
            canvas {
                height: 80vh; 
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <h2>Đo Sóng Âm Trực Tiếp</h2>
    
    <div class="controls-wrapper">
        <div class="controls">
            <button id="startButton">1. Bật Micro</button>
            <button id="pauseButton" disabled>2. Tiếp tục (Thu 5s)</button>
        </div>
    </div>

    <canvas id="oscilloscope"></canvas>

    <script>
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        
        let audioCtx;
        let analyser;
        let highpassFilter, lowpassFilter;
        let isPaused = true; 
        let sampleRate = 48000; 
        let stopTimer; 

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawFrame(); 
        }
        window.addEventListener('resize', resizeCanvas);

        function triggerAutoStop() {
            clearTimeout(stopTimer);
            if (!isPaused) {
                stopTimer = setTimeout(() => {
                    if (!isPaused) {
                        isPaused = true;
                        pauseButton.textContent = "2. Tiếp tục (Thu 5s)";
                        pauseButton.style.backgroundColor = "#28a745"; 
                    }
                }, 5000); 
            }
        }

        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioCtx.sampleRate; 
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                
                // Bộ lọc nhiễu tự động chạy ngầm
                highpassFilter = audioCtx.createBiquadFilter();
                highpassFilter.frequency.value = 80;
                highpassFilter.type = 'highpass';

                lowpassFilter = audioCtx.createBiquadFilter();
                lowpassFilter.frequency.value = 3000;
                lowpassFilter.type = 'lowpass';

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096; 
                
                source.connect(highpassFilter);
                highpassFilter.connect(lowpassFilter);
                lowpassFilter.connect(analyser);

                isPaused = true;
                resizeCanvas();
                drawFrame(); 
                
                startButton.textContent = "Đã kết nối";
                startButton.disabled = true;
                pauseButton.disabled = false;
                pauseButton.textContent = "2. Tiếp tục (Thu 5s)";
            } catch (err) {
                alert("Không thể truy cập micro. Vui lòng cấp quyền! Lỗi: " + err);
            }
        });

        pauseButton.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                pauseButton.textContent = "Đang thu (5s)...";
                pauseButton.style.backgroundColor = "#dc3545"; 
                draw(); 
                triggerAutoStop(); 
            } else {
                isPaused = true;
                clearTimeout(stopTimer); 
                pauseButton.textContent = "2. Tiếp tục (Thu 5s)";
                pauseButton.style.backgroundColor = "#28a745"; 
            }
        });

        function drawFrame() {
            if (!analyser) {
                canvasCtx.fillStyle = '#e6f7ff'; 
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }
            
            const bufferLength = analyser.frequencyBinCount; 
            const dataArray = new Uint8Array(bufferLength);
            
            if (!isPaused) {
                analyser.getByteTimeDomainData(dataArray);
            }

            const zoomY = 2.0;               
            const totalTimeOnScreen = 0.04; 

            canvasCtx.fillStyle = '#e6f7ff'; 
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.strokeStyle = '#b3e0ff'; 
            canvasCtx.lineWidth = 1;
            const stepX = canvas.width / 10;  
            const stepY = canvas.height / 8;  
            
            canvasCtx.beginPath();
            for(let i = 0; i <= 10; i++) {
                canvasCtx.moveTo(i * stepX, 0);
                canvasCtx.lineTo(i * stepX, canvas.height);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(0, i * stepY);
                canvasCtx.lineTo(canvas.width, i * stepY);
            }
            canvasCtx.stroke();

            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#000000'; 
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2); 
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.moveTo(canvas.width / 2, 0);  
            canvasCtx.lineTo(canvas.width / 2, canvas.height);
            canvasCtx.stroke();

            canvasCtx.fillStyle = '#000000'; 
            canvasCtx.font = 'bold 13px Arial';
            
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'top';
            for(let i = 0; i <= 10; i++) {
                if (i !== 5) { 
                    let t_val = parseFloat(((i - 5) * 0.004).toFixed(3));
                    let t_str = t_val.toString().replace('.', ',');
                    canvasCtx.fillText(t_str + "s", i * stepX, canvas.height / 2 + 5);
                }
            }
            
            canvasCtx.textAlign = 'left';
            canvasCtx.textBaseline = 'middle';
            const maxY = 1.0 / zoomY; 
            const valPerStep = (maxY * 2) / 8; 
            for(let i = 0; i <= 8; i++) {
                if (i !== 4) { 
                    let val = maxY - (i * valPerStep);
                    let val_str = parseFloat(val.toFixed(3)).toString().replace('.', ',');
                    canvasCtx.fillText(val_str, canvas.width / 2 + 8, i * stepY);
                } else {
                    canvasCtx.fillText("0", canvas.width / 2 + 8, canvas.height / 2 - 12); 
                }
            }

            if (!isPaused || dataArray[0] !== 0) {
                canvasCtx.lineWidth = 3; 
                canvasCtx.strokeStyle = '#ff0000'; 
                canvasCtx.beginPath();

                const samplesNeeded = totalTimeOnScreen * sampleRate;
                const sliceWidth = canvas.width / samplesNeeded;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] ? dataArray[i] / 128.0 : 1.0; 
                    const y = (v - 1.0) * zoomY * (canvas.height / 2) + (canvas.height / 2);

                    if (i === 0) {
                        canvasCtx.moveTo(x, y);
                    } else {
                        canvasCtx.lineTo(x, y);
                    }

                    x += sliceWidth;
                    if (x > canvas.width) break; 
                }

                canvasCtx.stroke();
            }
        }

        function draw() {
            if (isPaused) return; 
            requestAnimationFrame(draw);
            drawFrame();
        }
    </script>
</body>
</html>
