<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao động ký (Oscilloscope) - Sóng âm</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #e6f7ff;
            font-family: sans-serif;
        }
        
        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background-color: #f0f4f8;
            border-bottom: 3px solid #000;
            box-sizing: border-box;
            gap: 15px;
            z-index: 10;
        }

        .info-panel {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            background: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #pauseButton {
            background-color: #28a745; 
        }
        #pauseButton:hover { filter: brightness(0.9); }

        canvas {
            flex-grow: 1;
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div class="controls-wrapper">
        <div style="display: flex; gap: 10px; align-items: center;">
            <button id="startButton">1. Bật Micro</button>
            <button id="pauseButton" disabled>2. Đo</button>
        </div>
        <div class="info-panel" id="infoText">Tần số: Đang chờ... | 6 Chu kỳ: --</div>
    </div>

    <canvas id="oscilloscope"></canvas>

    <script>
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const infoText = document.getElementById('infoText');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        
        let audioCtx;
        let analyser;
        let highpassFilter, lowpassFilter;
        let isPaused = true; 
        let sampleRate = 48000; 
        let stopTimer; 
        let detectedFrequency = 440; // Mặc định giả định 440Hz

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawFrame(); 
        }
        window.addEventListener('resize', resizeCanvas);

        // Thuật toán tự động tìm tần số cơ bản từ mảng dữ liệu (Autocorrelation)
        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length;
            let sumSq = 0;
            for (let i = 0; i < SIZE; i++) {
                let val = (buffer[i] - 128) / 128;
                sumSq += val * val;
            }
            let rootMeanSq = Math.sqrt(sumSq / SIZE);
            if (rootMeanSq < 0.01) return -1; // Quá nhỏ/yên lặng

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs((buffer[i] - 128) / 128) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs((buffer[SIZE - i] - 128) / 128) < thres) { r2 = SIZE - i; break; }
            }

            buffer = buffer.slice(r1, r2);
            SIZE = buffer.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    let v1 = (buffer[j] - 128) / 128;
                    let v2 = (buffer[j + i] - 128) / 128;
                    c[i] += v1 * v2;
                }
            }

            let d = 0;
            while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) {
                    maxval = c[i];
                    maxpos = i;
                }
            }
            let T0 = maxpos;
            return sampleRate / T0;
        }

        function triggerAutoStop() {
            clearTimeout(stopTimer);
            if (!isPaused) {
                // Tự động ngưng sau 2 giây (2000ms)
                stopTimer = setTimeout(() => {
                    if (!isPaused) {
                        isPaused = true;
                        pauseButton.textContent = "2. Đo";
                        pauseButton.style.backgroundColor = "#28a745"; 
                    }
                }, 2000); 
            }
        }

        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioCtx.sampleRate; 
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                
                highpassFilter = audioCtx.createBiquadFilter();
                highpassFilter.frequency.value = 80;
                highpassFilter.type = 'highpass';

                lowpassFilter = audioCtx.createBiquadFilter();
                lowpassFilter.frequency.value = 3000;
                lowpassFilter.type = 'lowpass';

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096; 
                
                source.connect(highpassFilter);
                highpassFilter.connect(lowpassFilter);
                lowpassFilter.connect(analyser);

                isPaused = true;
                resizeCanvas();
                drawFrame(); 
                
                startButton.textContent = "Đã kết nối";
                startButton.disabled = true;
                pauseButton.disabled = false;
                pauseButton.textContent = "2. Đo";
            } catch (err) {
                alert("Không thể truy cập micro. Vui lòng cấp quyền! Lỗi: " + err);
            }
        });

        pauseButton.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                pauseButton.textContent = "Đang đo...";
                pauseButton.style.backgroundColor = "#dc3545"; 
                draw(); 
                triggerAutoStop(); 
            } else {
                isPaused = true;
                clearTimeout(stopTimer); 
                pauseButton.textContent = "2. Đo";
                pauseButton.style.backgroundColor = "#28a745"; 
            }
        });

        function drawFrame() {
            if (!analyser) {
                canvasCtx.fillStyle = '#e6f7ff'; 
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }
            
            const bufferLength = analyser.frequencyBinCount; 
            const dataArray = new Uint8Array(bufferLength);
            
            if (!isPaused) {
                analyser.getByteTimeDomainData(dataArray);
                // Phân tích tần số từ âm thanh thực tế thu vào
                let freq = autoCorrelate(dataArray, sampleRate);
                if (freq > 50 && freq < 2000) {
                    detectedFrequency = freq;
                }
            }

            // Tính khoảng thời gian sao cho đúng 6 chu kỳ (6 * T = 6 / f) hiển thị trên toàn màn hình
            let period = 1.0 / detectedFrequency;
            let totalTimeOnScreen = 6 * period; 

            // Cập nhật thông tin lên bảng nhỏ
            infoText.textContent = `Tần số: ${detectedFrequency.toFixed(1)} Hz | 6 Chu kỳ: ${(totalTimeOnScreen * 1000).toFixed(1)} ms`;

            const zoomY = 2.0;               

            canvasCtx.fillStyle = '#e6f7ff'; 
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ lưới ô ly (10 ô trục X)
            canvasCtx.strokeStyle = '#b3e0ff'; 
            canvasCtx.lineWidth = 1;
            const stepX = canvas.width / 10;  
            const stepY = canvas.height / 8;  
            
            canvasCtx.beginPath();
            for(let i = 0; i <= 10; i++) {
                canvasCtx.moveTo(i * stepX, 0);
                canvasCtx.lineTo(i * stepX, canvas.height);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(0, i * stepY);
                canvasCtx.lineTo(canvas.width, i * stepY);
            }
            canvasCtx.stroke();

            // Vẽ trục tọa độ
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#000000'; 
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2); 
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.moveTo(canvas.width / 2, 0);  
            canvasCtx.lineTo(canvas.width / 2, canvas.height);
            canvasCtx.stroke();

            // Ghi chú số liệu thời gian tự động theo 6 chu kỳ
            canvasCtx.fillStyle = '#000000'; 
            canvasCtx.font = 'bold 15px Arial';
            
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'top';
            let timePerGrid = totalTimeOnScreen / 10;
            for(let i = 0; i <= 10; i++) {
                if (i !== 5) { 
                    let t_val = parseFloat(((i - 5) * timePerGrid).toFixed(4));
                    let t_str = (t_val * 1000).toFixed(1).replace('.', ',') + "ms"; 
                    canvasCtx.fillText(t_str, i * stepX, canvas.height / 2 + 8);
                }
            }
            
            canvasCtx.textAlign = 'left';
            canvasCtx.textBaseline = 'middle';
            const maxY = 1.0 / zoomY; 
            const valPerStep = (maxY * 2) / 8; 
            for(let i = 0; i <= 8; i++) {
                if (i !== 4) { 
                    let val = maxY - (i * valPerStep);
                    let val_str = parseFloat(val.toFixed(3)).toString().replace('.', ',');
                    canvasCtx.fillText(val_str, canvas.width / 2 + 8, i * stepY);
                } else {
                    canvasCtx.fillText("0", canvas.width / 2 + 8, canvas.height / 2 - 15); 
                }
            }

            // Vẽ sóng đỏ
            if (!isPaused || dataArray[0] !== 0) {
                canvasCtx.lineWidth = 3; 
                canvasCtx.strokeStyle = '#ff0000'; 
                canvasCtx.beginPath();

                const samplesNeeded = totalTimeOnScreen * sampleRate;
                const sliceWidth = canvas.width / samplesNeeded;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] ? dataArray[i] / 128.0 : 1.0; 
                    const y = (v - 1.0) * zoomY * (canvas.height / 2) + (canvas.height / 2);

                    if (i === 0) {
                        canvasCtx.moveTo(x, y);
                    } else {
                        canvasCtx.lineTo(x, y);
                    }

                    x += sliceWidth;
                    if (x > canvas.width) break; 
                }

                canvasCtx.stroke();
            }
        }

        function draw() {
            if (isPaused) return; 
            requestAnimationFrame(draw);
            drawFrame();
        }
    </script>
</body>
</html>
