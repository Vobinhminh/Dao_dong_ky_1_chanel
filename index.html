<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao động ký (Oscilloscope) - Sóng âm</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f4f8;
            color: #333;
            font-family: sans-serif;
            margin: 0;
            padding: 10px 15px;
        }
        h2 {
            margin: 10px 0 15px 0;
            font-size: 1.5rem;
        }
        canvas {
            background-color: #e6f7ff; 
            border: 3px solid #000;
            width: 100%;
            max-width: 1200px;
            height: 60vh; /* Đồ thị to hơn vì đã bỏ các nút zoom */
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #pauseButton {
            background-color: #28a745; 
        }
        #pauseButton:hover { filter: brightness(0.9); }
        
        .toggle-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            background: #ffe6e6;
            border: 2px solid #ff9999;
        }
        .toggle-box input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Tối ưu hóa khi xoay ngang điện thoại */
        @media (orientation: landscape) {
            body { padding: 5px 15px; }
            h2 { display: none; } 
            .controls-wrapper {
                flex-direction: row; 
                justify-content: center;
            }
            canvas {
                height: 80vh; 
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <h2>Đo Sóng Âm Trực Tiếp</h2>
    
    <div class="controls-wrapper">
        <div class="controls">
            <button id="startButton">1. Bật Micro</button>
            <button id="pauseButton" disabled>2. Tiếp tục</button>
            
            <label class="toggle-box">
                <input type="checkbox" id="noiseFilter"> Lọc Nhiễu
            </label>
        </div>
    </div>

    <canvas id="oscilloscope"></canvas>

    <script>
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const filterCheckbox = document.getElementById('noiseFilter');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        
        let audioCtx;
        let analyser;
        let highpassFilter, lowpassFilter;
        let isPaused = true; 
        let sampleRate = 48000; 
        let stopTimer; 

        filterCheckbox.addEventListener('change', (e) => {
            if (highpassFilter && lowpassFilter) {
                if (e.target.checked) {
                    highpassFilter.type = 'highpass'; 
                    lowpassFilter.type = 'lowpass';   
                } else {
                    highpassFilter.type = 'allpass';  
                    lowpassFilter.type = 'allpass';
                }
            }
        });

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawFrame(); 
        }
        window.addEventListener('resize', resizeCanvas);

        function triggerAutoStop() {
            clearTimeout(stopTimer);
            if (!isPaused) {
                stopTimer = setTimeout(() => {
                    if (!isPaused) {
                        isPaused = true;
                        pauseButton.textContent = "Tiếp tục";
                        pauseButton.style.backgroundColor = "#28a745"; 
                    }
                }, 500); 
            }
        }

        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioCtx.sampleRate; 
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                
                highpassFilter = audioCtx.createBiquadFilter();
                highpassFilter.frequency.value = 80;
                highpassFilter.type = filterCheckbox.checked ? 'highpass' : 'allpass';

                lowpassFilter = audioCtx.createBiquadFilter();
                lowpassFilter.frequency.value = 3000;
                lowpassFilter.type = filterCheckbox.checked ? 'lowpass' : 'allpass';

                analyser = audioCtx.createAnalyser();
                // Nâng cấp fftSize lên 4096 để đảm bảo lấy đủ dữ liệu âm thanh quét kín 0.04 giây
                analyser.fftSize = 4096; 
                
                source.connect(highpassFilter);
                highpassFilter.connect(lowpassFilter);
                lowpassFilter.connect(analyser);

                isPaused = true;
                resizeCanvas();
                drawFrame(); 
                
                startButton.textContent = "Đã kết nối";
                startButton.disabled = true;
                pauseButton.disabled = false;
                pauseButton.textContent = "2. Tiếp tục";
            } catch (err) {
                alert("Không thể truy cập micro. Vui lòng cấp quyền! Lỗi: " + err);
            }
        });

        pauseButton.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                pauseButton.textContent = "Đang thu...";
                pauseButton.style.backgroundColor = "#dc3545"; 
                draw(); 
                triggerAutoStop(); 
            } else {
                isPaused = true;
                clearTimeout(stopTimer); 
                pauseButton.textContent = "Tiếp tục";
                pauseButton.style.backgroundColor = "#28a745"; 
            }
        });

        function drawFrame() {
            if (!analyser) {
                canvasCtx.fillStyle = '#e6f7ff'; 
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }
            
            const bufferLength = analyser.frequencyBinCount; 
            const dataArray = new Uint8Array(bufferLength);
            
            if (!isPaused) {
                analyser.getByteTimeDomainData(dataArray);
            }

            // --- THIẾT LẬP THÔNG SỐ CỐ ĐỊNH ---
            const zoomY = 2.0;               // Trục Y cố định cường độ x2
            const totalTimeOnScreen = 0.04;  // Tổng thời gian màn hình 0.04s (-0.02s đến 0.02s)

            canvasCtx.fillStyle = '#e6f7ff'; 
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ lưới ô ly
            canvasCtx.strokeStyle = '#b3e0ff'; 
            canvasCtx.lineWidth = 1;
            const stepX = canvas.width / 4;  // Trục X chia làm 4 ô (mỗi ô đúng 0.01s)
            const stepY = canvas.height / 8; // Trục Y chia làm 8 ô
            
            canvasCtx.beginPath();
            for(let i = 0; i <= 4; i++) {
                canvasCtx.moveTo(i * stepX, 0);
                canvasCtx.lineTo(i * stepX, canvas.height);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(0, i * stepY);
                canvasCtx.lineTo(canvas.width, i * stepY);
            }
            canvasCtx.stroke();

            // Vẽ trục tọa độ trung tâm ĐEN
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#000000'; 
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2); 
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.moveTo(canvas.width / 2, 0);  
            canvasCtx.lineTo(canvas.width / 2, canvas.height);
            canvasCtx.stroke();

            // Ghi chú số liệu 
            canvasCtx.fillStyle = '#000000'; 
            canvasCtx.font = 'bold 14px Arial';
            
            // Trục X: -0.02s, -0.01s, 0, 0.01s, 0.02s
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'top';
            for(let i = 0; i <= 4; i++) {
                if (i !== 2) {
                    let t = ((i - 2) * 0.01).toFixed(2);
                    canvasCtx.fillText(t + "s", i * stepX, canvas.height / 2 + 5);
                }
            }
            
            // Trục Y: Phóng đại x2
            canvasCtx.textAlign = 'left';
            canvasCtx.textBaseline = 'middle';
            const maxY = 1.0 / zoomY; // Tại x2, đỉnh màn hình là 0.5
            const valPerStep = (maxY * 2) / 8; 
            for(let i = 0; i <= 8; i++) {
                if (i !== 4) { 
                    let val = maxY - (i * valPerStep); 
                    canvasCtx.fillText(val.toFixed(3), canvas.width / 2 + 8, i * stepY);
                } else {
                    canvasCtx.fillText("0", canvas.width / 2 + 8, canvas.height / 2 - 12); 
                }
            }

            // Vẽ sóng đỏ
            if (!isPaused || dataArray[0] !== 0) {
                canvasCtx.lineWidth = 3; 
                canvasCtx.strokeStyle = '#ff0000'; 
                canvasCtx.beginPath();

                // Tính toán để phân bổ dữ liệu vừa khít 0.04s lên màn hình
                const samplesNeeded = totalTimeOnScreen * sampleRate;
                const sliceWidth = canvas.width / samplesNeeded;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] ? dataArray[i] / 128.0 : 1.0; 
                    const y = (v - 1.0) * zoomY * (canvas.height / 2) + (canvas.height / 2);

                    if (i === 0) {
                        canvasCtx.moveTo(x, y);
                    } else {
                        canvasCtx.lineTo(x, y);
                    }

                    x += sliceWidth;
                    // Dừng vẽ nếu nét vẽ đã chạy hết viền phải màn hình
                    if (x > canvas.width) break; 
                }

                canvasCtx.stroke();
            }
        }

        function draw() {
            if (isPaused) return; 
            requestAnimationFrame(draw);
            drawFrame();
        }
    </script>
</body>
</html>
