<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao động ký (Oscilloscope) - Sóng âm</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #e6f7ff;
            font-family: sans-serif;
            overflow: hidden; 
        }

        body {
            display: flex;
            flex-direction: column;
        }
        
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            padding: 8px;
            background-color: #f0f4f8;
            border-bottom: 3px solid #000;
            gap: 8px;
            z-index: 10;
        }

        .btn-group {
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            width: 100%;
        }

        @media (max-width: 800px) {
            .btn-group {
                grid-template-columns: 1fr 1fr 1fr; 
            }
        }

        @media (max-width: 500px) {
            .btn-group {
                grid-template-columns: 1fr 1fr; 
            }
            #fullscreenButton {
                grid-column: span 2; 
            }
        }

        .info-panel {
            font-weight: bold;
            font-size: 14px;
            color: #d93025;
            background: #fff;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        button {
            padding: 10px 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
            width: 100%; 
            box-sizing: border-box;
        }
        button:hover { background-color: #0056b3; }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #pauseButton { background-color: #28a745; }
        #resetButton { background-color: #fd7e14; }
        #saveButton { background-color: #17a2b8; }
        #fullscreenButton { background-color: #6c757d; }
        
        #pauseButton:hover, #resetButton:hover, #saveButton:hover, #fullscreenButton:hover { 
            filter: brightness(0.9); 
        }

        canvas {
            flex-grow: 1;
            width: 100%;
            height: 0; 
            display: block;
            cursor: crosshair;
            touch-action: none; 
        }
    </style>
</head>
<body>
    <div class="controls-wrapper">
        <div class="btn-group">
            <button id="startButton">1. Bật Micro</button>
            <button id="pauseButton" disabled>2. Đo / Dừng</button>
            <button id="resetButton" disabled>3. Làm mới</button>
            <button id="saveButton" disabled>4. Chụp ảnh đồ thị</button>
            <button id="fullscreenButton">5. Toàn màn hình</button>
        </div>
        
        <div class="info-panel" id="infoText">Đang chờ bật Micro...</div>
    </div>

    <canvas id="oscilloscope"></canvas>

    <script>
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const resetButton = document.getElementById('resetButton');
        const saveButton = document.getElementById('saveButton');
        const fullscreenButton = document.getElementById('fullscreenButton');
        const infoText = document.getElementById('infoText');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        
        let audioCtx, processor, dummyGain;
        let highpassFilter, lowpassFilter;
        let isPaused = true; 
        let sampleRate = 48000; 
        let stopTimer; 

        // Bộ đệm lưu trữ sâu (trọn vẹn 3 giây)
        let recordedData;
        let recordIndex = 0;

        // Các biến phục vụ thuật toán 5 Chu kỳ (5T)
        let detectedFrequency = 0;
        let lastCorrelateTime = 0;
        let isUserZoomed = false; // Đánh dấu khi học sinh tự vuốt tay

        let totalTimeOnScreen = 5 * (1.0 / 440); // Khởi tạo mặc định 5T của 440Hz
        let currentZoomY = 2.0;
        
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawFrame(true); 
        }
        window.addEventListener('resize', resizeCanvas);

        let initialPinchDistX = 0;
        let initialPinchDistY = 0;
        let startDuration = totalTimeOnScreen;
        let startZoomY = 2.0;

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                let dx = Math.abs(e.touches[0].clientX - e.touches[1].clientX);
                let dy = Math.abs(e.touches[0].clientY - e.touches[1].clientY);
                initialPinchDistX = Math.max(dx, 10); 
                initialPinchDistY = Math.max(dy, 10);
                startDuration = totalTimeOnScreen;
                startZoomY = currentZoomY;
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                let dx = Math.abs(e.touches[0].clientX - e.touches[1].clientX);
                let dy = Math.abs(e.touches[0].clientY - e.touches[1].clientY);
                dx = Math.max(dx, 10);
                dy = Math.max(dy, 10);

                isUserZoomed = true; // Ngắt chế độ tự động 5T vì người dùng đã can thiệp
                totalTimeOnScreen = startDuration * (initialPinchDistX / dx); 
                currentZoomY = startZoomY * (dy / initialPinchDistY);

                // Giới hạn Zoom: từ siêu nhỏ (soi đỉnh sóng) đến trọn vẹn 2.4s (-1.2s đến 1.2s)
                totalTimeOnScreen = Math.max(0.01, Math.min(totalTimeOnScreen, 2.4));
                currentZoomY = Math.max(0.5, Math.min(currentZoomY, 10.0));

                if (isPaused) drawFrame();
            }
        }, {passive: false});

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            isUserZoomed = true;
            if (e.shiftKey) {
                if (e.deltaY > 0) totalTimeOnScreen *= 1.1;
                else totalTimeOnScreen /= 1.1;
                totalTimeOnScreen = Math.max(0.01, Math.min(totalTimeOnScreen, 2.4));
            } else {
                if (e.deltaY < 0) currentZoomY *= 1.1; 
                else currentZoomY /= 1.1; 
                currentZoomY = Math.max(0.5, Math.min(currentZoomY, 10.0));
            }
            if (isPaused) drawFrame();
        }, {passive: false});

        fullscreenButton.addEventListener('click', () => {
            let elem = document.documentElement;
            let isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;

            if (!isFullscreen) {
                if (elem.requestFullscreen) elem.requestFullscreen().catch(() => alert("Xoay ngang điện thoại nhé!"));
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        });

        function updateFullscreenButton() {
            let isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            fullscreenButton.textContent = !isFullscreen ? "5. Toàn màn hình" : "5. Thu nhỏ";
            setTimeout(resizeCanvas, 100); 
        }

        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);

        // Thuật toán nhận diện tần số (Sửa đổi để tương thích với Float32Array của Deep Buffer)
        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length;
            let sumSq = 0;
            for (let i = 0; i < SIZE; i++) {
                let val = buffer[i];
                sumSq += val * val;
            }
            let rootMeanSq = Math.sqrt(sumSq / SIZE);
            if (rootMeanSq < 0.02) return -1; // Bỏ qua nếu quá yên tĩnh

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE / 2; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    c[i] += buffer[j] * buffer[j + i];
                }
            }

            let d = 0;
            while (c[d] > c[d + 1] && d < SIZE / 2) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE / 2; i++) {
                if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            }
            
            if (maxpos <= 0) return -1;
            let freq = sampleRate / maxpos;
            if (freq < 100 || freq > 1500) return -1; 
            return freq;
        }

        function triggerAutoStop() {
            clearTimeout(stopTimer);
            if (!isPaused) {
                stopTimer = setTimeout(() => {
                    if (!isPaused) {
                        isPaused = true;
                        pauseButton.textContent = "2. Đo / Dừng";
                        pauseButton.style.backgroundColor = "#28a745"; 
                        infoText.textContent = "Đã dừng - Đồ thị tự động dàn 5 Chu kỳ";
                        infoText.style.color = "#d93025";
                    }
                }, 2000); 
            }
        }

        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioCtx.sampleRate; 
                recordedData = new Float32Array(sampleRate * 3); 
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                
                highpassFilter = audioCtx.createBiquadFilter();
                highpassFilter.frequency.value = 80;
                highpassFilter.type = 'highpass';

                lowpassFilter = audioCtx.createBiquadFilter();
                lowpassFilter.frequency.value = 3000;
                lowpassFilter.type = 'lowpass';

                processor = audioCtx.createScriptProcessor(4096, 1, 1);
                processor.onaudioprocess = function(e) {
                    if (!isPaused) {
                        let input = e.inputBuffer.getChannelData(0);
                        for (let i = 0; i < input.length; i++) {
                            if (recordIndex < recordedData.length) {
                                recordedData[recordIndex++] = input[i];
                            }
                        }
                    }
                };

                source.connect(highpassFilter);
                highpassFilter.connect(lowpassFilter);
                lowpassFilter.connect(processor);

                dummyGain = audioCtx.createGain();
                dummyGain.gain.value = 0;
                processor.connect(dummyGain);
                dummyGain.connect(audioCtx.destination);

                isPaused = true;
                resizeCanvas();
                drawFrame(); 
                
                startButton.textContent = "Đã kết nối";
                startButton.disabled = true;
                pauseButton.disabled = false;
                resetButton.disabled = false;
                saveButton.disabled = false;
                
                infoText.textContent = "Trạng thái: Đã sẵn sàng";
                infoText.style.color = "#007bff";
            } catch (err) {
                alert("Không thể truy cập micro. Lỗi: " + err);
            }
        });

        pauseButton.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                recordIndex = 0; 
                recordedData.fill(0);
                
                // Khôi phục tự động bắt 5 chu kỳ cho lần đo mới
                isUserZoomed = false; 
                detectedFrequency = 0;

                pauseButton.textContent = "Đang đo...";
                pauseButton.style.backgroundColor = "#dc3545"; 
                infoText.textContent = "Đang ghi âm (Quét Live & Tính toán 5 Chu kỳ)...";
                infoText.style.color = "#dc3545";
                draw(); 
                triggerAutoStop(); 
            } else {
                isPaused = true;
                clearTimeout(stopTimer); 
                pauseButton.textContent = "2. Đo / Dừng";
                pauseButton.style.backgroundColor = "#28a745"; 
                infoText.textContent = "Đã dừng - Đồ thị tự động dàn 5 Chu kỳ";
                infoText.style.color = "#d93025";
            }
        });

        resetButton.addEventListener('click', () => {
            isPaused = true;
            clearTimeout(stopTimer); 
            pauseButton.textContent = "2. Đo / Dừng";
            pauseButton.style.backgroundColor = "#28a745"; 
            
            recordIndex = 0;
            recordedData.fill(0);
            
            // Trả về mặc định
            isUserZoomed = false;
            detectedFrequency = 0;
            totalTimeOnScreen = 5 * (1.0 / 440); 
            currentZoomY = 2.0; 
            
            infoText.textContent = "Sẵn sàng (Bấm 'Đo / Dừng' để tiếp tục)";
            infoText.style.color = "#007bff";
            
            drawFrame(true); 
        });

        saveButton.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `DoThi_SongAm.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        function drawFrame(isReset = false) {
            if (!audioCtx) {
                canvasCtx.fillStyle = '#e6f7ff'; 
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }

            // Dò tần số liên tục nếu đang đo
            if (!isPaused && recordIndex > 2048) {
                let now = Date.now();
                if (now - lastCorrelateTime > 300) {
                    let recentData = recordedData.subarray(recordIndex - 2048, recordIndex);
                    let freq = autoCorrelate(recentData, sampleRate);
                    if (freq > 0) detectedFrequency = freq;
                    lastCorrelateTime = now;
                }
            }

            // Ép trục X chuẩn 5 Chu kỳ nếu học sinh chưa vuốt tay can thiệp
            if (!isUserZoomed) {
                let freqForCalc = (detectedFrequency > 0) ? detectedFrequency : 440;
                totalTimeOnScreen = 5 * (1.0 / freqForCalc);
                totalTimeOnScreen = Math.max(0.01, Math.min(totalTimeOnScreen, 2.4));
            }

            const zoomY = currentZoomY;

            canvasCtx.fillStyle = '#e6f7ff'; 
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.strokeStyle = '#b3e0ff'; 
            canvasCtx.lineWidth = 1;
            const stepX = canvas.width / 10;  
            const stepY = canvas.height / 8;  
            
            canvasCtx.beginPath();
            for(let i = 0; i <= 10; i++) {
                canvasCtx.moveTo(i * stepX, 0); canvasCtx.lineTo(i * stepX, canvas.height);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(0, i * stepY); canvasCtx.lineTo(canvas.width, i * stepY);
            }
            canvasCtx.stroke();

            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#000000'; 
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2); 
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.moveTo(canvas.width / 2, 0);  
            canvasCtx.lineTo(canvas.width / 2, canvas.height);
            
            const tickSize = 5; 
            for(let i = 0; i <= 10; i++) {
                canvasCtx.moveTo(i * stepX, canvas.height / 2 - tickSize);
                canvasCtx.lineTo(i * stepX, canvas.height / 2 + tickSize);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(canvas.width / 2 - tickSize, i * stepY);
                canvasCtx.lineTo(canvas.width / 2 + tickSize, i * stepY);
            }
            canvasCtx.stroke();

            // Ghi số liệu trục X (Thời gian mili-giây)
            canvasCtx.fillStyle = '#000000'; 
            canvasCtx.font = 'bold 13px Arial';
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'top';
            let timePerGrid = totalTimeOnScreen / 10;
            for(let i = 0; i <= 10; i++) {
                if (i !== 5) { 
                    let t_val = (i - 5) * timePerGrid;
                    let ms = t_val * 1000;
                    // Làm tròn thông minh: tối đa 2 số lẻ, xóa đuôi 0 thừa
                    let t_str = parseFloat(ms.toFixed(2)).toString().replace('.', ','); 
                    canvasCtx.fillText(t_str, i * stepX, canvas.height / 2 + 10);
                }
            }
            canvasCtx.textAlign = 'right';
            canvasCtx.fillText("t (ms)", canvas.width - 10, canvas.height / 2 - 25);
            
            canvasCtx.textAlign = 'left';
            canvasCtx.textBaseline = 'middle';
            const maxY = 1.0 / zoomY; 
            const valPerStep = (maxY * 2) / 8; 
            for(let i = 0; i <= 8; i++) {
                if (i !== 4 && i !== 0) { 
                    let val = maxY - (i * valPerStep);
                    let val_str = parseFloat(val.toFixed(2)).toString().replace('.', ',');
                    canvasCtx.fillText(val_str, canvas.width / 2 + 10, i * stepY);
                }
            }
            canvasCtx.fillText("0", canvas.width / 2 + 8, canvas.height / 2 + 15); 
            canvasCtx.textBaseline = 'top';
            canvasCtx.fillText("Biên độ", canvas.width / 2 + 10, 10);

            if (isReset) return;

            // VẼ ĐỒ THỊ VỚI DEEP BUFFER
            if (recordIndex > 0) {
                canvasCtx.save(); 
                canvasCtx.beginPath();
                canvasCtx.rect(0, 0, canvas.width, canvas.height);
                canvasCtx.clip(); 

                canvasCtx.lineWidth = 3; 
                canvasCtx.strokeStyle = '#ff0000'; 
                canvasCtx.beginPath();

                const samplesNeeded = Math.floor(totalTimeOnScreen * sampleRate);
                const sliceWidth = canvas.width / samplesNeeded;
                let x = 0;
                let hasMoved = false;

                if (!isPaused) {
                    // LIVE: Cuộn sóng từ phải qua trái liên tục
                    const startIndex = recordIndex - samplesNeeded;
                    const endIndex = startIndex + samplesNeeded;

                    for (let i = startIndex; i < endIndex; i++) {
                        let v = 0;
                        if (i >= 0 && i < recordIndex) v = recordedData[i];
                        let y = (v * -1.0) * zoomY * (canvas.height / 2) + (canvas.height / 2);
                        
                        if (!hasMoved) { canvasCtx.moveTo(x, y); hasMoved = true; } 
                        else { canvasCtx.lineTo(x, y); }
                        x += sliceWidth;
                        if (x > canvas.width) break; 
                    }
                } else {
                    // DỪNG LẠI: Trải đều 2 giây âm thanh ra, lấy tâm điểm
                    const centerBuffer = Math.floor(recordIndex / 2);
                    const halfSamples = Math.floor(samplesNeeded / 2);
                    const startIndex = centerBuffer - halfSamples;
                    const endIndex = startIndex + samplesNeeded;

                    for (let i = startIndex; i < endIndex; i++) {
                        let v = 0;
                        if (i >= 0 && i < recordIndex) v = recordedData[i];
                        let y = (v * -1.0) * zoomY * (canvas.height / 2) + (canvas.height / 2);
                        
                        if (!hasMoved) { canvasCtx.moveTo(x, y); hasMoved = true; } 
                        else { canvasCtx.lineTo(x, y); }
                        x += sliceWidth;
                        if (x > canvas.width) break; 
                    }
                }
                
                canvasCtx.stroke();
                canvasCtx.restore(); 
            }
        }

        function draw() {
            if (isPaused) return; 
            requestAnimationFrame(draw);
            drawFrame();
        }
    </script>
</body>
</html>
