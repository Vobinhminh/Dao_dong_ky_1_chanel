<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao động ký (Oscilloscope) - Tích hợp AudioWorklet</title>
    
    <!-- KHAI BÁO ICON -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #e6f7ff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; }
        .top-bar { display: flex; background-color: #f0f4f8; border-bottom: 3px solid #000; z-index: 10; padding: 8px; gap: 8px; align-items: stretch; }
        .controls-wrapper { display: flex; flex-direction: column; flex-grow: 1; gap: 6px; justify-content: center; }
        .btn-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
        .custom-select { padding: 6px; font-size: 13px; font-weight: bold; color: #0056b3; border-radius: 6px; border: 1px solid #ccc; background-color: #fff; width: 100%; cursor: pointer; outline: none; box-sizing: border-box; }
        
        /* KHUNG CHỨA QR CODE - Tự động cao bằng 3 dòng bên trái */
        .qr-container { display: flex; gap: 6px; flex-shrink: 0; }
        .qr-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 4px; box-sizing: border-box; width: 85px; }
        .qr-panel img { width: 55px; height: 55px; border: 1px solid #eee; }
        .qr-panel .scan-title { font-size: 10px; font-weight: bold; color: #d93025; margin-top: 4px; text-align: center; line-height: 1.2; }
        
        @media (max-width: 900px) { .top-bar { padding: 0; gap: 0; } .controls-wrapper { padding: 8px; } .qr-container { display: none; } .btn-group { grid-template-columns: 1fr 1fr 1fr; } }
        @media (max-width: 500px) { .btn-group { grid-template-columns: 1fr 1fr; } #fullscreenButton { grid-column: span 2; } #settingsRow { flex-direction: column; } }

        .info-panel { font-weight: bold; font-size: 13px; color: #d93025; background: #fff; padding: 6px; border-radius: 6px; border: 1px solid #ccc; text-align: center; flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        button { padding: 8px 4px; font-size: 13px; font-weight: bold; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 6px; transition: background-color 0.2s; width: 100%; box-sizing: border-box; }
        button:hover { filter: brightness(0.9); }
        button:disabled { background-color: #999; cursor: not-allowed; }
        #pauseButton { background-color: #28a745; }
        #resetButton { background-color: #fd7e14; }
        #saveButton { background-color: #17a2b8; }
        #fullscreenButton { background-color: #6c757d; }
        canvas { flex-grow: 1; width: 100%; height: 0; display: block; cursor: crosshair; touch-action: none; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="controls-wrapper">
            <div class="btn-group">
                <button id="startButton">1. Bật Micro</button>
                <button id="pauseButton" disabled>2. Đo / Dừng</button>
                <button id="resetButton" disabled>3. Làm mới</button>
                <button id="saveButton" disabled>4. Chụp đồ thị</button>
                <button id="fullscreenButton">5. Toàn màn hình</button>
            </div>
            <div id="settingsRow" style="display: none; gap: 6px; width: 100%;">
                <select id="micSelect" class="custom-select" style="display: none; flex: 1;"></select>
                <select id="modeSelect" class="custom-select" style="flex: 1;">
                    <option value="auto" selected>Chức năng: Khảo sát tần số (Quét tự động)</option>
                    <option value="continuous">Chức năng: Khảo sát nguồn âm (Đo liên tục)</option>
                </select>
                <select id="speedSelect" class="custom-select" style="display: none; flex: 1;">
                    <option value="fast" selected>Tốc độ: Nhanh</option>
                    <option value="slow">Tốc độ: Chậm</option>
                </select>
            </div>
            <div class="info-panel" id="infoText">Đang chờ bật Micro... (Tích hợp AudioWorklet)</div>
        </div>
        
        <div class="qr-container" id="qrContainer">
            <div class="qr-panel">
                <img id="qrTeacher" src="" alt="QR GV">
                <span class="scan-title">Giáo Viên<br>(Vô hạn)</span>
            </div>
            <div class="qr-panel">
                <img id="qrStudent" src="" alt="QR HS">
                <span class="scan-title">Học Sinh<br>(30 Phút)</span>
            </div>
        </div>
    </div>

    <canvas id="oscilloscope"></canvas>

    <script>
        // =================================================================
        // 1. KIỂM TRA PHÂN QUYỀN VÀ GIỚI HẠN 30 PHÚT
        // =================================================================
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');

            // Nếu mở trên điện thoại quét mã thì tự động ẩn khung QR đi cho gọn
            if (role) {
                const qrContainer = document.getElementById('qrContainer');
                if (qrContainer) qrContainer.style.display = 'none'; 
            }

            // Xử lý giới hạn 30 phút cho Học sinh
            if (role === 'student') {
                const timeLimitMinutes = 30; 
                setTimeout(() => {
                    document.body.innerHTML = `
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0f172a; color:#f8fafc; font-family:sans-serif; text-align:center; padding:20px;">
                            <h1 style="color:#ef4444; margin-bottom:15px; font-size: 24px;">⏰ Đã hết thời gian thí nghiệm (30 phút)!</h1>
                            <p style="font-size:16px; color:#94a3b8; max-width: 400px; line-height:1.5;">Phiên làm việc của em đã kết thúc. Vui lòng liên hệ Giáo viên để nhận mã QR mới nếu cần tiếp tục.</p>
                        </div>
                    `;
                }, timeLimitMinutes * 60 * 1000);
            }

            // Tự động tạo 2 ảnh QR Code (GV và HS)
            if (!role) {
                let currentUrl = window.location.href.split('?')[0];
                if (currentUrl.startsWith('file://')) currentUrl = 'https://github.com/TenCuaThay/DaoDongKy';
                
                const qrTeacher = document.getElementById('qrTeacher');
                const qrStudent = document.getElementById('qrStudent');
                
                if (qrTeacher) qrTeacher.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl + '?role=teacher')}`;
                if (qrStudent) qrStudent.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl + '?role=student')}`;
            }
        });

        // =================================================================
        // 2. AUDIOWORKLET MODULE (Xử lý âm thanh độc lập - Không gây giật lag)
        // =================================================================
        const workletCode = `
        class ScopeWorkletProcessor extends AudioWorkletProcessor {
            process(inputs, outputs, parameters) {
                const inputChannel = inputs[0][0];
                if (inputChannel) this.port.postMessage(inputChannel);
                return true;
            }
        }
        registerProcessor('scope-worklet', ScopeWorkletProcessor);
        `;
        const workletBlob = new Blob([workletCode], { type: 'application/javascript' });
        const workletUrl = URL.createObjectURL(workletBlob);

        // Các biến DOM
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const resetButton = document.getElementById('resetButton');
        const saveButton = document.getElementById('saveButton');
        const fullscreenButton = document.getElementById('fullscreenButton');
        const infoText = document.getElementById('infoText');
        const micSelect = document.getElementById('micSelect');
        const modeSelect = document.getElementById('modeSelect');
        const speedSelect = document.getElementById('speedSelect');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        
        let audioCtx, scopeWorkletNode, highpassFilter, lowpassFilter, currentStream, audioSource;
        let isPaused = true, isContinuousMode = false, needReset = false;
        let sampleRate = 48000, recordIndex = 0, stopTimer;
        let recordedData;
        let detectedFrequency = 0, lastCorrelateTime = 0, isUserZoomed = false;
        let totalTimeOnScreen = 5 * (1.0 / 440), currentZoomY = 2.0;
        let targetFPS = 60, lastDrawTime = performance.now();

        // Tự động dừng đo khi ẩn màn hình điện thoại ra ngoài
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && !isPaused) {
                pauseMeasurement(true);
                infoText.textContent = "⚠️ Bị gián đoạn! Vui lòng bấm 'Làm mới' trước khi đo lại.";
            }
        });

        speedSelect.addEventListener('change', e => targetFPS = e.target.value === 'slow' ? 10 : 60);
        modeSelect.addEventListener('change', e => {
            isContinuousMode = e.target.value === 'continuous';
            speedSelect.style.display = isContinuousMode ? 'block' : 'none';
            if (!isContinuousMode) { targetFPS = 60; speedSelect.value = "fast"; }
        });

        function resizeCanvas() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; drawFrame(); }
        window.addEventListener('resize', resizeCanvas);

        // Điều khiển Zoom trên màn hình cảm ứng / Chuột
        let startDuration, startZoomY, initialPinchDistX, initialPinchDistY;
        canvas.addEventListener('touchstart', e => {
            if (e.touches.length === 2 && isPaused) {
                e.preventDefault();
                initialPinchDistX = Math.max(Math.abs(e.touches[0].clientX - e.touches[1].clientX), 10);
                initialPinchDistY = Math.max(Math.abs(e.touches[0].clientY - e.touches[1].clientY), 10);
                startDuration = totalTimeOnScreen; startZoomY = currentZoomY;
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', e => {
            if (e.touches.length === 2 && isPaused) {
                e.preventDefault();
                isUserZoomed = true;
                totalTimeOnScreen = Math.max(0.002, Math.min(startDuration * (initialPinchDistX / Math.max(Math.abs(e.touches[0].clientX - e.touches[1].clientX), 10)), 2.4));
                currentZoomY = Math.max(0.5, Math.min(startZoomY * (Math.max(Math.abs(e.touches[0].clientY - e.touches[1].clientY), 10) / initialPinchDistY), 10.0));
                drawFrame();
            }
        }, {passive: false});

        canvas.addEventListener('wheel', e => {
            if (isPaused) {
                e.preventDefault();
                isUserZoomed = true;
                if (e.deltaY > 0) { totalTimeOnScreen *= 1.1; currentZoomY /= 1.1; } 
                else { totalTimeOnScreen /= 1.1; currentZoomY *= 1.1; }
                totalTimeOnScreen = Math.max(0.002, Math.min(totalTimeOnScreen, 2.4));
                currentZoomY = Math.max(0.5, Math.min(currentZoomY, 10.0));
                drawFrame();
            }
        }, {passive: false});

        fullscreenButton.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => alert("Lỗi toàn màn hình. Hãy xoay ngang điện thoại nhé!"));
            else document.exitFullscreen();
        });

        document.addEventListener('fullscreenchange', () => {
            fullscreenButton.textContent = document.fullscreenElement ? "5. Thu nhỏ" : "5. Toàn màn hình";
            setTimeout(resizeCanvas, 100);
        });

        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length, sumSq = 0;
            for (let i = 0; i < SIZE; i++) sumSq += buffer[i] * buffer[i];
            if (Math.sqrt(sumSq / SIZE) < 0.02) return -1;
            
            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE / 2; i++)
                for (let j = 0; j < SIZE - i; j++) c[i] += buffer[j] * buffer[j + i];
            
            let d = 0; while (c[d] > c[d + 1] && d < SIZE / 2) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE / 2; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            
            let freq = sampleRate / maxpos;
            return (freq >= 100 && freq <= 1500) ? freq : -1;
        }

        async function initAudio(deviceId = null) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioCtx.sampleRate;
                recordedData = new Float32Array(sampleRate * 3); 
                
                await audioCtx.audioWorklet.addModule(workletUrl);
                scopeWorkletNode = new AudioWorkletNode(audioCtx, 'scope-worklet');

                scopeWorkletNode.port.onmessage = e => {
                    if (!isPaused) {
                        const inputData = e.data;
                        for (let i = 0; i < inputData.length; i++) recordedData[recordIndex++ % recordedData.length] = inputData[i];
                    }
                };

                highpassFilter = audioCtx.createBiquadFilter(); highpassFilter.type = 'highpass'; highpassFilter.frequency.value = 80;
                lowpassFilter = audioCtx.createBiquadFilter(); lowpassFilter.type = 'lowpass'; lowpassFilter.frequency.value = 3000;
                highpassFilter.connect(lowpassFilter); lowpassFilter.connect(scopeWorkletNode); scopeWorkletNode.connect(audioCtx.destination);
            }

            try {
                if (currentStream) currentStream.getTracks().forEach(t => t.stop());
                if (audioSource) audioSource.disconnect();

                currentStream = await navigator.mediaDevices.getUserMedia({ audio: deviceId ? { deviceId: { exact: deviceId } } : true });
                audioSource = audioCtx.createMediaStreamSource(currentStream);
                audioSource.connect(highpassFilter);
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                isPaused = true; resizeCanvas(); drawFrame(true);
                
                startButton.textContent = "Đã kết nối"; startButton.disabled = true;
                pauseButton.disabled = false; resetButton.disabled = false; saveButton.disabled = false;
                infoText.textContent = "Trạng thái: Sẵn sàng (AudioWorklet Đang chạy)"; infoText.style.color = "#007bff";

                if (!deviceId) {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const audioInputs = devices.filter(d => d.kind === 'audioinput');
                    micSelect.innerHTML = '';
                    audioInputs.forEach((d, i) => micSelect.appendChild(new Option(d.label || `Microphone ${i + 1}`, d.deviceId)));
                    document.getElementById('settingsRow').style.display = 'flex';
                    micSelect.style.display = audioInputs.length > 1 ? 'block' : 'none';
                }
            } catch (err) { alert("Không thể truy cập micro. Lỗi: " + err); }
        }

        startButton.addEventListener('click', () => initAudio());
        micSelect.addEventListener('change', e => {
            initAudio(e.target.value);
            needReset = false; pauseMeasurement();
            infoText.textContent = `Đã chuyển sang: ${e.target.options[e.target.selectedIndex].text}`;
            recordIndex = 0; recordedData.fill(0); drawFrame(true);
        });

        function pauseMeasurement(forceStop = false) {
            isPaused = true;
            clearTimeout(stopTimer);
            pauseButton.textContent = "2. Đo / Dừng"; pauseButton.style.backgroundColor = "#28a745";
            if (!forceStop) {
                infoText.textContent = isContinuousMode ? "Đã tạm dừng đồ thị" : "Đã đo xong - Ấn nút 'Đo / Dừng' để tiếp tục";
                infoText.style.color = "#d93025";
            }
        }

        pauseButton.addEventListener('click', async () => {
            if (needReset) return alert("Hệ thống Micro bị gián đoạn. Vui lòng bấm nút '3. Làm mới' để kết nối lại!");

            if (isPaused) {
                if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
                isPaused = false; recordIndex = 0; recordedData.fill(0); isUserZoomed = false; detectedFrequency = 0;
                pauseButton.textContent = "Đang đo..."; pauseButton.style.backgroundColor = "#dc3545";
                infoText.textContent = isContinuousMode ? "Khảo sát nguồn âm (Đang thu...)" : "Khảo sát tần số (Quét Live)...";
                infoText.style.color = "#dc3545";
                lastDrawTime = performance.now(); draw();
                
                if (!isContinuousMode) stopTimer = setTimeout(() => { if (!isPaused) pauseMeasurement(); }, 2000);
            } else pauseMeasurement();
        });

        resetButton.addEventListener('click', async () => {
            pauseMeasurement();
            if (needReset || !currentStream || currentStream.getAudioTracks()[0].readyState === 'ended') {
                infoText.textContent = "Đang khởi động lại phần cứng Micro...";
                await initAudio(micSelect.style.display !== 'none' ? micSelect.value : null);
            } else if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
            
            needReset = false; lastDrawTime = performance.now(); recordIndex = 0; recordedData.fill(0);
            isUserZoomed = false; detectedFrequency = 0; totalTimeOnScreen = 5 * (1.0 / 440); currentZoomY = 2.0;
            infoText.textContent = "Sẵn sàng (Bấm 'Đo / Dừng' để tiếp tục)"; infoText.style.color = "#007bff";
            drawFrame(true);
        });

        saveButton.addEventListener('click', () => {
            const link = document.createElement('a'); link.download = 'DoThi_SongAm.png'; link.href = canvas.toDataURL('image/png'); link.click();
        });

        function drawFrame(isReset = false) {
            if (!audioCtx) { canvasCtx.fillStyle = '#e6f7ff'; canvasCtx.fillRect(0, 0, canvas.width, canvas.height); return; }

            if (!isPaused && recordIndex > 2048 && Date.now() - lastCorrelateTime > 300) {
                let recentData = new Float32Array(2048);
                for(let i=0; i<2048; i++) recentData[i] = recordedData[(recordIndex - 2048 + i) % recordedData.length];
                let freq = autoCorrelate(recentData, sampleRate);
                if (freq > 0) detectedFrequency = freq;
                lastCorrelateTime = Date.now();
            }

            if (!isUserZoomed) totalTimeOnScreen = Math.max(0.002, Math.min(5 * (1.0 / (detectedFrequency > 0 ? detectedFrequency : 440)), 2.4));

            canvasCtx.fillStyle = '#e6f7ff'; canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.strokeStyle = '#b3e0ff'; canvasCtx.lineWidth = 1;
            
            const stepX = canvas.width / 10, stepY = canvas.height / 8;
            canvasCtx.beginPath();
            for(let i=0; i<=10; i++) { canvasCtx.moveTo(i * stepX, 0); canvasCtx.lineTo(i * stepX, canvas.height); }
            for(let i=0; i<=8; i++) { canvasCtx.moveTo(0, i * stepY); canvasCtx.lineTo(canvas.width, i * stepY); }
            canvasCtx.stroke();

            canvasCtx.lineWidth = 2; canvasCtx.strokeStyle = '#000000'; canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2); canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.moveTo(canvas.width / 2, 0); canvasCtx.lineTo(canvas.width / 2, canvas.height);
            for(let i=0; i<=10; i++) { canvasCtx.moveTo(i * stepX, canvas.height/2 - 5); canvasCtx.lineTo(i * stepX, canvas.height/2 + 5); }
            for(let i=0; i<=8; i++) { canvasCtx.moveTo(canvas.width/2 - 5, i * stepY); canvasCtx.lineTo(canvas.width/2 + 5, i * stepY); }
            canvasCtx.stroke();

            canvasCtx.fillStyle = '#000000'; canvasCtx.font = 'bold 13px Arial'; canvasCtx.textAlign = 'center'; canvasCtx.textBaseline = 'top';
            for(let i=0; i<=10; i++) if (i !== 5) canvasCtx.fillText(parseFloat(((i - 5) * (totalTimeOnScreen / 10) * 1000).toFixed(2)).toString().replace('.', ','), i * stepX, canvas.height/2 + 10);
            canvasCtx.textAlign = 'right'; canvasCtx.fillText("t (ms)", canvas.width - 10, canvas.height / 2 - 25);
            canvasCtx.textAlign = 'left'; canvasCtx.textBaseline = 'middle';
            const maxY = 1.0 / currentZoomY, valStep = (maxY * 2) / 8;
            for(let i=0; i<=8; i++) if (i !== 4 && i !== 0) canvasCtx.fillText(parseFloat((maxY - i * valStep).toFixed(2)).toString().replace('.', ','), canvas.width/2 + 10, i * stepY);
            canvasCtx.fillText("0", canvas.width/2 + 8, canvas.height/2 + 15); canvasCtx.textBaseline = 'top'; canvasCtx.fillText("Biên độ", canvas.width/2 + 10, 10);

            if (isReset || recordIndex === 0) return;

            canvasCtx.save(); canvasCtx.beginPath(); canvasCtx.rect(0, 0, canvas.width, canvas.height); canvasCtx.clip();
            canvasCtx.lineWidth = 3; canvasCtx.strokeStyle = '#ff0000'; canvasCtx.beginPath();

            const samplesNeeded = Math.floor(totalTimeOnScreen * sampleRate);
            const step = Math.max(1, Math.floor(samplesNeeded / (canvas.width * 2)));
            const sliceWidth = (canvas.width / samplesNeeded) * step;
            let x = 0, hasMoved = false, startIndex = recordIndex - samplesNeeded;

            for (let i = startIndex; i < startIndex + samplesNeeded; i += step) {
                if (i < 0 || i >= recordIndex) { x += sliceWidth; continue; }
                let v = recordedData[i % recordedData.length];
                if (step > 2) {
                    let maxV = v, minV = v;
                    for(let j = 1; j < step; j++) if (i + j < recordIndex) { let tv = recordedData[(i+j) % recordedData.length]; if(tv>maxV) maxV=tv; if(tv<minV) minV=tv; }
                    let yMin = (-minV) * currentZoomY * (canvas.height/2) + (canvas.height/2);
                    if (!hasMoved) { canvasCtx.moveTo(x, yMin); hasMoved = true; } else canvasCtx.lineTo(x, yMin);
                    canvasCtx.lineTo(x, (-maxV) * currentZoomY * (canvas.height/2) + (canvas.height/2));
                } else {
                    let y = (-v) * currentZoomY * (canvas.height/2) + (canvas.height/2);
                    if (!hasMoved) { canvasCtx.moveTo(x, y); hasMoved = true; } else canvasCtx.lineTo(x, y);
                }
                x += sliceWidth; if (x > canvas.width) break;
            }
            canvasCtx.stroke(); canvasCtx.restore();
        }

        function draw(timestamp) {
            if (isPaused) return; requestAnimationFrame(draw);
            if (!timestamp) timestamp = performance.now();
            let elapsed = timestamp - lastDrawTime, interval = 1000 / targetFPS;
            if (elapsed > interval) { lastDrawTime = timestamp - (elapsed % interval); drawFrame(); }
        }
    </script>
</body>
</html>
