<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao động ký (Oscilloscope) - Sóng âm</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #e6f7ff;
            font-family: sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        
        .controls-wrapper {
            display: flex;
            flex-wrap: wrap; 
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #f0f4f8;
            border-bottom: 3px solid #000;
            box-sizing: border-box;
            gap: 15px;
            z-index: 10;
            flex-shrink: 0; 
        }

        .btn-group {
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            align-items: center;
        }

        .slider-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-weight: bold;
        }

        .slider-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .info-panel {
            font-weight: bold;
            font-size: 15px;
            color: #d93025;
            background: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            min-width: 200px;
            text-align: center;
            flex-grow: 1; 
        }

        button {
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        button:hover { background-color: #0056b3; }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #pauseButton { background-color: #28a745; }
        #resetButton { background-color: #fd7e14; }
        #saveButton { background-color: #17a2b8; }
        #fullscreenButton { background-color: #6c757d; }
        
        #pauseButton:hover, #resetButton:hover, #saveButton:hover, #fullscreenButton:hover { 
            filter: brightness(0.9); 
        }

        canvas {
            flex-grow: 1;
            width: 100%;
            min-height: 400px; 
            display: block;
        }
    </style>
</head>
<body>
    <div class="controls-wrapper">
        <div class="btn-group">
            <button id="startButton">1. Bật Micro</button>
            <button id="pauseButton" disabled>2. Đo / Dừng</button>
            <button id="resetButton" disabled>3. Làm mới</button>
            <button id="saveButton" disabled>4. Chụp ảnh đồ thị</button>
            <button id="fullscreenButton">5. Toàn màn hình</button>
        </div>
        
        <div class="slider-group">
            <label>
                Trục Y (Biên độ): 
                <input type="range" id="zoomY" min="0.5" max="5.0" step="0.1" value="2.0">
            </label>
            <label>
                Trục X (Thời gian): 
                <input type="range" id="zoomX" min="0.2" max="3.0" step="0.1" value="1.0">
            </label>
        </div>

        <div class="info-panel" id="infoText">Trạng thái: Đang chờ bật Micro...</div>
    </div>

    <canvas id="oscilloscope"></canvas>

    <script>
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const resetButton = document.getElementById('resetButton');
        const saveButton = document.getElementById('saveButton');
        const fullscreenButton = document.getElementById('fullscreenButton');
        const infoText = document.getElementById('infoText');
        const zoomYSlider = document.getElementById('zoomY');
        const zoomXSlider = document.getElementById('zoomX');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        
        let audioCtx, analyser, highpassFilter, lowpassFilter;
        let isPaused = true; 
        let sampleRate = 48000; 
        let stopTimer; 
        let detectedFrequency = 0; 
        
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawFrame(true); 
        }
        window.addEventListener('resize', resizeCanvas);

        fullscreenButton.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Lỗi toàn màn hình: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) fullscreenButton.textContent = "5. Toàn màn hình";
            else fullscreenButton.textContent = "5. Thu nhỏ (Thoát)";
            setTimeout(resizeCanvas, 100); 
        });

        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length;
            let sumSq = 0;
            for (let i = 0; i < SIZE; i++) {
                let val = (buffer[i] - 128) / 128;
                sumSq += val * val;
            }
            let rootMeanSq = Math.sqrt(sumSq / SIZE);
            if (rootMeanSq < 0.01) return -1; 

            let r1 = 0, r2 = SIZE - 1, thres = 0.2;
            for (let i = 0; i < SIZE / 2; i++) {
                if (Math.abs((buffer[i] - 128) / 128) < thres) { r1 = i; break; }
            }
            for (let i = 1; i < SIZE / 2; i++) {
                if (Math.abs((buffer[SIZE - i] - 128) / 128) < thres) { r2 = SIZE - i; break; }
            }

            buffer = buffer.slice(r1, r2);
            SIZE = buffer.length;

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    let v1 = (buffer[j] - 128) / 128;
                    let v2 = (buffer[j + i] - 128) / 128;
                    c[i] += v1 * v2;
                }
            }

            let d = 0;
            while (c[d] > c[d + 1]) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE; i++) {
                if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            }
            return sampleRate / maxpos;
        }

        function triggerAutoStop() {
            clearTimeout(stopTimer);
            if (!isPaused) {
                stopTimer = setTimeout(() => {
                    if (!isPaused) {
                        isPaused = true;
                        pauseButton.textContent = "2. Đo / Dừng";
                        pauseButton.style.backgroundColor = "#28a745"; 
                        infoText.textContent = "Đã dừng - Hãy xác định chu kỳ T và tần số f";
                        infoText.style.color = "#d93025";
                    }
                }, 2000); 
            }
        }

        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioCtx.sampleRate; 
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                
                highpassFilter = audioCtx.createBiquadFilter();
                highpassFilter.frequency.value = 80;
                highpassFilter.type = 'highpass';

                lowpassFilter = audioCtx.createBiquadFilter();
                lowpassFilter.frequency.value = 3000;
                lowpassFilter.type = 'lowpass';

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 4096; 
                
                source.connect(highpassFilter);
                highpassFilter.connect(lowpassFilter);
                lowpassFilter.connect(analyser);

                isPaused = true;
                resizeCanvas();
                drawFrame(); 
                
                startButton.textContent = "Đã kết nối micro";
                startButton.disabled = true;
                pauseButton.disabled = false;
                resetButton.disabled = false;
                saveButton.disabled = false;
                
                infoText.textContent = "Trạng thái: Đã sẵn sàng";
                infoText.style.color = "#007bff";
            } catch (err) {
                alert("Không thể truy cập micro. Lỗi: " + err);
            }
        });

        pauseButton.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                pauseButton.textContent = "Đang đo...";
                pauseButton.style.backgroundColor = "#dc3545"; 
                infoText.textContent = "Trạng thái: Đang ghi sóng âm...";
                infoText.style.color = "#dc3545";
                draw(); 
                triggerAutoStop(); 
            } else {
                isPaused = true;
                clearTimeout(stopTimer); 
                pauseButton.textContent = "2. Đo / Dừng";
                pauseButton.style.backgroundColor = "#28a745"; 
                infoText.textContent = "Đã dừng - Hãy xác định chu kỳ T và tần số f";
                infoText.style.color = "#d93025";
            }
        });

        resetButton.addEventListener('click', () => {
            isPaused = true;
            clearTimeout(stopTimer); 
            pauseButton.textContent = "2. Đo / Dừng";
            pauseButton.style.backgroundColor = "#28a745"; 
            
            detectedFrequency = 0;
            infoText.textContent = "Trạng thái: Đã sẵn sàng";
            infoText.style.color = "#007bff";
            
            drawFrame(true);
        });

        saveButton.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `DoThi_SongAm_ThucHanh.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        zoomXSlider.addEventListener('input', () => { if(isPaused) drawFrame(); });
        zoomYSlider.addEventListener('input', () => { if(isPaused) drawFrame(); });

        function drawFrame(isReset = false) {
            if (!analyser) {
                canvasCtx.fillStyle = '#e6f7ff'; 
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }
            
            const bufferLength = analyser.frequencyBinCount; 
            const dataArray = new Uint8Array(bufferLength);
            
            // Code vẫn âm thầm tự tìm tần số để vẽ đồ thị đẹp (5 chu kỳ), nhưng KHÔNG hiển thị ra UI
            if (!isPaused && !isReset) {
                analyser.getByteTimeDomainData(dataArray);
                let freq = autoCorrelate(dataArray, sampleRate);
                if (freq > 50 && freq < 2000) detectedFrequency = freq;
            }

            const zoomY = parseFloat(zoomYSlider.value);
            const zoomX = parseFloat(zoomXSlider.value);

            let freqForCalc = (detectedFrequency > 0 && !isReset) ? detectedFrequency : 440; 
            let period = 1.0 / freqForCalc;
            let totalTimeOnScreen = 5 * period * zoomX; 

            // Xóa nền
            canvasCtx.fillStyle = '#e6f7ff'; 
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            // Vẽ lưới
            canvasCtx.strokeStyle = '#b3e0ff'; 
            canvasCtx.lineWidth = 1;
            const stepX = canvas.width / 10;  
            const stepY = canvas.height / 8;  
            
            canvasCtx.beginPath();
            for(let i = 0; i <= 10; i++) {
                canvasCtx.moveTo(i * stepX, 0); canvasCtx.lineTo(i * stepX, canvas.height);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(0, i * stepY); canvasCtx.lineTo(canvas.width, i * stepY);
            }
            canvasCtx.stroke();

            // Vẽ trục tọa độ chính
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#000000'; 
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2); canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.moveTo(canvas.width / 2, 0);  canvasCtx.lineTo(canvas.width / 2, canvas.height);
            canvasCtx.stroke();

            // Ghi số liệu lên trục
            canvasCtx.fillStyle = '#000000'; 
            canvasCtx.font = 'bold 15px Arial';
            
            // Trục X (Thời gian bằng mili-giây)
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'top';
            let timePerGrid = totalTimeOnScreen / 10;
            for(let i = 0; i <= 10; i++) {
                if (i !== 5) { 
                    let t_val = parseFloat(((i - 5) * timePerGrid).toFixed(4));
                    let t_str = (t_val * 1000).toFixed(1).replace('.', ',') + "ms"; 
                    canvasCtx.fillText(t_str, i * stepX, canvas.height / 2 + 8);
                }
            }
            
            // Trục Y
            canvasCtx.textAlign = 'left';
            canvasCtx.textBaseline = 'middle';
            const maxY = 1.0 / zoomY; 
            const valPerStep = (maxY * 2) / 8; 
            for(let i = 0; i <= 8; i++) {
                if (i !== 4) { 
                    let val = maxY - (i * valPerStep);
                    let val_str = parseFloat(val.toFixed(2)).toString().replace('.', ',');
                    canvasCtx.fillText(val_str, canvas.width / 2 + 8, i * stepY);
                } else {
                    canvasCtx.fillText("0", canvas.width / 2 + 8, canvas.height / 2 - 15); 
                }
            }

            if (isReset) return;

            // Vẽ đồ thị âm thanh
            if (!isPaused || dataArray[0] !== 0) {
                canvasCtx.lineWidth = 3; 
                canvasCtx.strokeStyle = '#ff0000'; 
                canvasCtx.beginPath();

                const samplesNeeded = totalTimeOnScreen * sampleRate;
                const sliceWidth = canvas.width / samplesNeeded;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] ? dataArray[i] / 128.0 : 1.0; 
                    const y = (v - 1.0) * zoomY * (canvas.height / 2) + (canvas.height / 2);

                    if (i === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);

                    x += sliceWidth;
                    if (x > canvas.width) break; 
                }
                canvasCtx.stroke();
            }
        }

        function draw() {
            if (isPaused) return; 
            requestAnimationFrame(draw);
            drawFrame();
        }
    </script>
</body>
</html>
