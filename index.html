<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao động ký (Oscilloscope) - Sóng âm</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #e6f7ff;
            font-family: sans-serif;
            overflow: hidden; 
        }

        body {
            display: flex;
            flex-direction: column;
        }
        
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            padding: 8px;
            background-color: #f0f4f8;
            border-bottom: 3px solid #000;
            gap: 8px;
            z-index: 10;
        }

        .btn-group {
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            width: 100%;
        }

        @media (max-width: 800px) {
            .btn-group {
                grid-template-columns: 1fr 1fr 1fr; 
            }
        }

        @media (max-width: 500px) {
            .btn-group {
                grid-template-columns: 1fr 1fr; 
            }
            #fullscreenButton {
                grid-column: span 2; 
            }
        }

        .info-panel {
            font-weight: bold;
            font-size: 14px;
            color: #d93025;
            background: #fff;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        button {
            padding: 10px 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
            width: 100%; 
            box-sizing: border-box;
        }
        button:hover { background-color: #0056b3; }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #pauseButton { background-color: #28a745; }
        #resetButton { background-color: #fd7e14; }
        #saveButton { background-color: #17a2b8; }
        #fullscreenButton { background-color: #6c757d; }
        
        #pauseButton:hover, #resetButton:hover, #saveButton:hover, #fullscreenButton:hover { 
            filter: brightness(0.9); 
        }

        canvas {
            flex-grow: 1;
            width: 100%;
            height: 0; 
            display: block;
            cursor: crosshair;
            touch-action: none; 
        }
    </style>
</head>
<body>
    <div class="controls-wrapper">
        <div class="btn-group">
            <button id="startButton">1. Bật Micro</button>
            <button id="pauseButton" disabled>2. Đo / Dừng</button>
            <button id="resetButton" disabled>3. Làm mới</button>
            <button id="saveButton" disabled>4. Chụp ảnh đồ thị</button>
            <button id="fullscreenButton">5. Toàn màn hình</button>
        </div>
        
        <div class="info-panel" id="infoText">Đang chờ bật Micro... (Chuẩn 5 chu kỳ)</div>
    </div>

    <canvas id="oscilloscope"></canvas>

    <script>
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const resetButton = document.getElementById('resetButton');
        const saveButton = document.getElementById('saveButton');
        const fullscreenButton = document.getElementById('fullscreenButton');
        const infoText = document.getElementById('infoText');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        
        let audioCtx, analyser, highpassFilter, lowpassFilter;
        let isPaused = true; 
        let sampleRate = 48000; 
        let detectedFrequency = 0; 
        let lastCorrelateTime = 0; 
        let stopTimer; 

        let currentZoomX = 1.0;
        let currentZoomY = 2.0;
        
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawFrame(true); 
        }
        window.addEventListener('resize', resizeCanvas);

        let initialPinchDistX = 0;
        let initialPinchDistY = 0;
        let startZoomX = 1.0;
        let startZoomY = 2.0;

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                let dx = Math.abs(e.touches[0].clientX - e.touches[1].clientX);
                let dy = Math.abs(e.touches[0].clientY - e.touches[1].clientY);
                initialPinchDistX = Math.max(dx, 10); 
                initialPinchDistY = Math.max(dy, 10);
                startZoomX = currentZoomX;
                startZoomY = currentZoomY;
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                let dx = Math.abs(e.touches[0].clientX - e.touches[1].clientX);
                let dy = Math.abs(e.touches[0].clientY - e.touches[1].clientY);
                dx = Math.max(dx, 10);
                dy = Math.max(dy, 10);

                currentZoomX = startZoomX * (initialPinchDistX / dx);
                currentZoomY = startZoomY * (dy / initialPinchDistY);

                currentZoomX = Math.max(0.4, Math.min(currentZoomX, 2.0));
                currentZoomY = Math.max(0.5, Math.min(currentZoomY, 10.0));

                if (isPaused) drawFrame();
            }
        }, {passive: false});

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.shiftKey) {
                if (e.deltaY > 0) currentZoomX *= 1.1;
                else currentZoomX /= 1.1;
                currentZoomX = Math.max(0.4, Math.min(currentZoomX, 2.0));
            } else {
                if (e.deltaY < 0) currentZoomY *= 1.1; 
                else currentZoomY /= 1.1; 
                currentZoomY = Math.max(0.5, Math.min(currentZoomY, 10.0));
            }
            if (isPaused) drawFrame();
        }, {passive: false});

        fullscreenButton.addEventListener('click', () => {
            let elem = document.documentElement;
            let isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;

            if (!isFullscreen) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => {
                        alert("Xoay ngang điện thoại để xem đồ thị to hơn nhé!");
                    });
                } else if (elem.webkitRequestFullscreen) { 
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { 
                    elem.msRequestFullscreen();
                } else {
                    alert("Hãy xoay ngang điện thoại để xem rõ hơn.");
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { 
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { 
                    document.msExitFullscreen();
                }
            }
        });

        function updateFullscreenButton() {
            let isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
            if (!isFullscreen) {
                fullscreenButton.textContent = "5. Toàn màn hình";
            } else {
                fullscreenButton.textContent = "5. Thu nhỏ";
            }
            setTimeout(resizeCanvas, 100); 
        }

        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        document.addEventListener('MSFullscreenChange', updateFullscreenButton);

        // Thuật toán autoCorrelate đã được siết chặt chống bắt nhầm tần số thấp
        function autoCorrelate(buffer, sampleRate) {
            let SIZE = buffer.length;
            let sumSq = 0;
            for (let i = 0; i < SIZE; i++) {
                let val = (buffer[i] - 128) / 128;
                sumSq += val * val;
            }
            let rootMeanSq = Math.sqrt(sumSq / SIZE);
            if (rootMeanSq < 0.02) return -1; 

            let c = new Array(SIZE).fill(0);
            for (let i = 0; i < SIZE / 2; i++) {
                for (let j = 0; j < SIZE - i; j++) {
                    let v1 = (buffer[j] - 128) / 128;
                    let v2 = (buffer[j + i] - 128) / 128;
                    c[i] += v1 * v2;
                }
            }

            let d = 0;
            while (c[d] > c[d + 1] && d < SIZE / 2) d++;
            let maxval = -1, maxpos = -1;
            for (let i = d; i < SIZE / 2; i++) {
                if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
            }
            
            if (maxpos <= 0) return -1;
            let freq = sampleRate / maxpos;
            // Ép dải tần số âm thanh thực tế từ 100Hz đến 1500Hz để tránh lỗi bắt sóng lạ
            if (freq < 100 || freq > 1500) return -1;
            return freq;
        }

        function triggerAutoStop() {
            clearTimeout(stopTimer);
            if (!isPaused) {
                stopTimer = setTimeout(() => {
                    if (!isPaused) {
                        isPaused = true;
                        pauseButton.textContent = "2. Đo / Dừng";
                        pauseButton.style.backgroundColor = "#28a745"; 
                        infoText.textContent = "Đã dừng (2s) - Đảm bảo chuẩn 5 chu kỳ";
                        infoText.style.color = "#d93025";
                    }
                }, 2000); 
            }
        }

        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioCtx.sampleRate; 
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                
                highpassFilter = audioCtx.createBiquadFilter();
                highpassFilter.frequency.value = 100; // Nâng nhẹ bộ lọc để lọc triệt để tiếng ồn trầm
                highpassFilter.type = 'highpass';

                lowpassFilter = audioCtx.createBiquadFilter();
                lowpassFilter.frequency.value = 2000;
                lowpassFilter.type = 'lowpass';

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 16384; 
                
                source.connect(highpassFilter);
                highpassFilter.connect(lowpassFilter);
                lowpassFilter.connect(analyser);

                isPaused = true;
                resizeCanvas();
                drawFrame(); 
                
                startButton.textContent = "Đã kết nối";
                startButton.disabled = true;
                pauseButton.disabled = false;
                resetButton.disabled = false;
                saveButton.disabled = false;
                
                infoText.textContent = "Trạng thái: Đã sẵn sàng";
                infoText.style.color = "#007bff";
            } catch (err) {
                alert("Không thể truy cập micro. Lỗi: " + err);
            }
        });

        pauseButton.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                pauseButton.textContent = "Đang đo...";
                pauseButton.style.backgroundColor = "#dc3545"; 
                infoText.textContent = "Đang ghi âm trong 2 giây (Chụp 5 chu kỳ chuẩn)...";
                infoText.style.color = "#dc3545";
                draw(); 
                triggerAutoStop(); 
            } else {
                isPaused = true;
                clearTimeout(stopTimer); 
                pauseButton.textContent = "2. Đo / Dừng";
                pauseButton.style.backgroundColor = "#28a745"; 
                infoText.textContent = "Đã dừng - Chuẩn 5 chu kỳ";
                infoText.style.color = "#d93025";
            }
        });

        resetButton.addEventListener('click', () => {
            isPaused = true;
            clearTimeout(stopTimer); 
            pauseButton.textContent = "2. Đo / Dừng";
            pauseButton.style.backgroundColor = "#28a745"; 
            
            detectedFrequency = 0;
            currentZoomX = 1.0; 
            currentZoomY = 2.0; 
            
            infoText.textContent = "Sẵn sàng - Bấm 'Đo / Dừng' để đo lần tiếp theo";
            infoText.style.color = "#007bff";
            
            drawFrame(true); 
        });

        saveButton.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `DoThi_SongAm_ThucHanh.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        function drawFrame(isReset = false) {
            if (!analyser) {
                canvasCtx.fillStyle = '#e6f7ff'; 
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }
            
            const bufferLength = analyser.fftSize; 
            const dataArray = new Uint8Array(bufferLength);
            
            if (!isPaused && !isReset) {
                analyser.getByteTimeDomainData(dataArray);
                let now = Date.now();
                if (now - lastCorrelateTime > 300) {
                    let freq = autoCorrelate(dataArray, sampleRate);
                    // Nếu phát hiện tần số hợp lệ, cập nhật. Nếu không, giữ nguyên hoặc dùng 440Hz chuẩn
                    if (freq > 0) detectedFrequency = freq;
                    lastCorrelateTime = now;
                }
            }

            const zoomY = currentZoomY;
            const zoomX = currentZoomX;

            let freqForCalc = (detectedFrequency > 0 && !isReset) ? detectedFrequency : 440; 
            let period = 1.0 / freqForCalc;
            let totalTimeOnScreen = 5 * period * zoomX; 

            canvasCtx.fillStyle = '#e6f7ff'; 
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.strokeStyle = '#b3e0ff'; 
            canvasCtx.lineWidth = 1;
            const stepX = canvas.width / 10;  
            const stepY = canvas.height / 8;  
            
            canvasCtx.beginPath();
            for(let i = 0; i <= 10; i++) {
                canvasCtx.moveTo(i * stepX, 0); canvasCtx.lineTo(i * stepX, canvas.height);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(0, i * stepY); canvasCtx.lineTo(canvas.width, i * stepY);
            }
            canvasCtx.stroke();

            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#000000'; 
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2); 
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.moveTo(canvas.width / 2, 0);  
            canvasCtx.lineTo(canvas.width / 2, canvas.height);
            
            const tickSize = 5; 
            for(let i = 0; i <= 10; i++) {
                canvasCtx.moveTo(i * stepX, canvas.height / 2 - tickSize);
                canvasCtx.lineTo(i * stepX, canvas.height / 2 + tickSize);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(canvas.width / 2 - tickSize, i * stepY);
                canvasCtx.lineTo(canvas.width / 2 + tickSize, i * stepY);
            }
            canvasCtx.stroke();

            canvasCtx.fillStyle = '#000000'; 
            canvasCtx.font = 'bold 14px Arial';
            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'top';
            let timePerGrid = totalTimeOnScreen / 10;
            for(let i = 0; i <= 10; i++) {
                if (i !== 5) { 
                    let t_val = parseFloat(((i - 5) * timePerGrid).toFixed(4));
                    let t_str = (t_val * 1000).toFixed(1).replace('.', ','); 
                    canvasCtx.fillText(t_str, i * stepX, canvas.height / 2 + 10);
                }
            }
            canvasCtx.textAlign = 'right';
            canvasCtx.fillText("t (ms)", canvas.width - 10, canvas.height / 2 - 25);
            
            canvasCtx.textAlign = 'left';
            canvasCtx.textBaseline = 'middle';
            const maxY = 1.0 / zoomY; 
            const valPerStep = (maxY * 2) / 8; 
            for(let i = 0; i <= 8; i++) {
                if (i !== 4 && i !== 0) { 
                    let val = maxY - (i * valPerStep);
                    let val_str = parseFloat(val.toFixed(2)).toString().replace('.', ',');
                    canvasCtx.fillText(val_str, canvas.width / 2 + 10, i * stepY);
                }
            }
            canvasCtx.fillText("0", canvas.width / 2 + 8, canvas.height / 2 + 15); 
            
            canvasCtx.textBaseline = 'top';
            canvasCtx.fillText("Biên độ", canvas.width / 2 + 10, 10);

            if (isReset) return;

            if (!isPaused || dataArray[0] !== 0) {
                canvasCtx.save(); 
                
                canvasCtx.beginPath();
                canvasCtx.rect(0, 0, canvas.width, canvas.height);
                canvasCtx.clip(); 

                canvasCtx.lineWidth = 3; 
                canvasCtx.strokeStyle = '#ff0000'; 
                canvasCtx.beginPath();

                const samplesNeeded = Math.floor(totalTimeOnScreen * sampleRate);
                const sliceWidth = canvas.width / samplesNeeded;
                let x = 0;
                let hasMoved = false;

                for (let i = 0; i < bufferLength && i < samplesNeeded; i++) {
                    const v = dataArray[i] ? dataArray[i] / 128.0 : 1.0; 
                    let y = (v - 1.0) * zoomY * (canvas.height / 2) + (canvas.height / 2);
                    
                    if (!hasMoved) {
                        canvasCtx.moveTo(x, y);
                        hasMoved = true;
                    } else {
                        canvasCtx.lineTo(x, y);
                    }

                    x += sliceWidth;
                    if (x > canvas.width) break; 
                }
                canvasCtx.stroke();
                
                canvasCtx.restore(); 
            }
        }

        function draw() {
            if (isPaused) return; 
            requestAnimationFrame(draw);
            drawFrame();
        }
    </script>
</body>
</html>
