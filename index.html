<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dao động ký (Oscilloscope) - Sóng âm</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f4f8;
            color: #333;
            font-family: sans-serif;
            margin: 0;
            padding: 10px 15px;
        }
        h2 {
            margin: 5px 0 10px 0;
            font-size: 1.5rem;
        }
        canvas {
            background-color: #e6f7ff; 
            border: 3px solid #000;
            width: 100%;
            max-width: 1200px;
            height: 55vh;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            gap: 10px;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #pauseButton {
            background-color: #28a745; 
        }
        #pauseButton:hover { filter: brightness(0.9); }
        
        .toggle-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            background: #ffe6e6;
            border: 2px solid #ff9999;
        }
        .toggle-box input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .zoom-controls {
            display: flex;
            gap: 8px;
            background: #ffffff;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .zoom-controls span {
            font-weight: bold;
            font-size: 14px;
            margin-right: 5px;
        }
        .zoom-btn {
            padding: 6px 12px;
            font-size: 14px;
            background-color: #e0e0e0;
            color: #333;
            box-shadow: none;
        }
        .zoom-btn:hover {
            background-color: #ccc;
        }
        .zoom-btn.active {
            background-color: #ff9800; /* Màu cam nổi bật cho mức zoom đang chọn */
            color: white;
        }

        /* ----- CSS ĐẶC BIỆT KHI XOAY NGANG ĐIỆN THOẠI (LANDSCAPE) ----- */
        @media (orientation: landscape) {
            body { padding: 5px 15px; }
            h2 { display: none; } 
            .controls-wrapper {
                flex-direction: row; 
                justify-content: space-between;
                align-items: center;
            }
            .zoom-controls {
                margin: 0;
                padding: 8px 12px;
            }
            canvas {
                height: 75vh; 
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <h2>Đo Sóng Âm Trực Tiếp</h2>
    
    <div class="controls-wrapper">
        <div class="controls">
            <button id="startButton">1. Bật Micro</button>
            <button id="pauseButton" disabled>2. Tiếp tục</button>
            
            <label class="toggle-box">
                <input type="checkbox" id="noiseFilter"> Lọc Nhiễu
            </label>
        </div>

        <div class="zoom-controls">
            <span>Phóng to:</span>
            <button class="zoom-btn active" data-zoom="1">1x</button>
            <button class="zoom-btn" data-zoom="2">2x</button>
            <button class="zoom-btn" data-zoom="3">3x</button>
            <button class="zoom-btn" data-zoom="5">5x</button>
        </div>
    </div>

    <canvas id="oscilloscope"></canvas>

    <script>
        const startButton = document.getElementById('startButton');
        const pauseButton = document.getElementById('pauseButton');
        const filterCheckbox = document.getElementById('noiseFilter');
        const canvas = document.getElementById('oscilloscope');
        const canvasCtx = canvas.getContext('2d');
        const zoomBtns = document.querySelectorAll('.zoom-btn');

        let audioCtx;
        let analyser;
        let highpassFilter, lowpassFilter;
        let isPaused = true; 
        let sampleRate = 48000; 
        let stopTimer; 
        let currentZoom = 1; // Mức zoom mặc định

        // Xử lý sự kiện khi bấm nút Zoom
        zoomBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Bỏ đánh dấu nút cũ
                zoomBtns.forEach(b => b.classList.remove('active'));
                // Đánh dấu nút mới
                e.target.classList.add('active');
                // Lấy giá trị zoom
                currentZoom = parseFloat(e.target.dataset.zoom);
                
                // Nếu đang dừng hình, vẽ lại ngay lập tức để thấy thay đổi
                if (isPaused) drawFrame(); 
            });
        });

        filterCheckbox.addEventListener('change', (e) => {
            if (highpassFilter && lowpassFilter) {
                if (e.target.checked) {
                    highpassFilter.type = 'highpass'; 
                    lowpassFilter.type = 'lowpass';   
                } else {
                    highpassFilter.type = 'allpass';  
                    lowpassFilter.type = 'allpass';
                }
            }
        });

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawFrame(); 
        }
        window.addEventListener('resize', resizeCanvas);

        function triggerAutoStop() {
            clearTimeout(stopTimer);
            if (!isPaused) {
                stopTimer = setTimeout(() => {
                    if (!isPaused) {
                        isPaused = true;
                        pauseButton.textContent = "Tiếp tục";
                        pauseButton.style.backgroundColor = "#28a745"; 
                    }
                }, 500); 
            }
        }

        startButton.addEventListener('click', async () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioCtx.sampleRate; 
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(stream);
                
                highpassFilter = audioCtx.createBiquadFilter();
                highpassFilter.frequency.value = 80;
                highpassFilter.type = filterCheckbox.checked ? 'highpass' : 'allpass';

                lowpassFilter = audioCtx.createBiquadFilter();
                lowpassFilter.frequency.value = 3000;
                lowpassFilter.type = filterCheckbox.checked ? 'lowpass' : 'allpass';

                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; 
                
                source.connect(highpassFilter);
                highpassFilter.connect(lowpassFilter);
                lowpassFilter.connect(analyser);

                isPaused = true;
                resizeCanvas();
                drawFrame(); 
                
                startButton.textContent = "Đã kết nối";
                startButton.disabled = true;
                pauseButton.disabled = false;
                pauseButton.textContent = "2. Tiếp tục";
            } catch (err) {
                alert("Không thể truy cập micro. Vui lòng cấp quyền! Lỗi: " + err);
            }
        });

        pauseButton.addEventListener('click', () => {
            if (isPaused) {
                isPaused = false;
                pauseButton.textContent = "Đang thu...";
                pauseButton.style.backgroundColor = "#dc3545"; 
                draw(); 
                triggerAutoStop(); 
            } else {
                isPaused = true;
                clearTimeout(stopTimer); 
                pauseButton.textContent = "Tiếp tục";
                pauseButton.style.backgroundColor = "#28a745"; 
            }
        });

        function drawFrame() {
            if (!analyser) {
                canvasCtx.fillStyle = '#e6f7ff'; 
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                return;
            }
            
            const bufferLength = analyser.frequencyBinCount; 
            const dataArray = new Uint8Array(bufferLength);
            
            if (!isPaused) {
                analyser.getByteTimeDomainData(dataArray);
            }

            // Dùng 1 biến currentZoom chung cho cả trục X và trục Y
            const zoomXY = currentZoom;

            canvasCtx.fillStyle = '#e6f7ff'; 
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.strokeStyle = '#b3e0ff'; 
            canvasCtx.lineWidth = 1;
            const stepX = canvas.width / 10; 
            const stepY = canvas.height / 8;  
            
            canvasCtx.beginPath();
            for(let i = 0; i <= 10; i++) {
                canvasCtx.moveTo(i * stepX, 0);
                canvasCtx.lineTo(i * stepX, canvas.height);
            }
            for(let i = 0; i <= 8; i++) {
                canvasCtx.moveTo(0, i * stepY);
                canvasCtx.lineTo(canvas.width, i * stepY);
            }
            canvasCtx.stroke();

            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#000000'; 
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2); 
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.moveTo(canvas.width / 2, 0);  
            canvasCtx.lineTo(canvas.width / 2, canvas.height);
            canvasCtx.stroke();

            canvasCtx.fillStyle = '#000000'; 
            canvasCtx.font = 'bold 12px Arial';
            
            // Tính toán lưới trục X dựa trên mức zoom chung
            const totalTimeOnScreen = (bufferLength / sampleRate) / zoomXY;
            const timePerGrid = totalTimeOnScreen / 10;

            canvasCtx.textAlign = 'center';
            canvasCtx.textBaseline = 'top';
            for(let i = 0; i <= 10; i++) {
                if (i !== 5) {
                    let t = (i * timePerGrid).toFixed(2);
                    canvasCtx.fillText(t + "s", i * stepX, canvas.height / 2 + 5);
                }
            }
            
            // Tính toán lưới trục Y dựa trên mức zoom chung
            canvasCtx.textAlign = 'left';
            canvasCtx.textBaseline = 'middle';
            for(let i = 0; i <= 8; i++) {
                if (i !== 4) { 
                    let val = (4 - i) / 4; 
                    let displayVal = (val / zoomXY).toFixed(2); 
                    canvasCtx.fillText(displayVal, canvas.width / 2 + 8, i * stepY);
                } else {
                    canvasCtx.fillText("0", canvas.width / 2 + 8, canvas.height / 2 - 12); 
                }
            }

            if (!isPaused || dataArray[0] !== 0) {
                canvasCtx.lineWidth = 3; 
                canvasCtx.strokeStyle = '#ff0000'; 
                canvasCtx.beginPath();

                // Áp dụng zoom cho nét vẽ
                const sliceWidth = (canvas.width * zoomXY) / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] ? dataArray[i] / 128.0 : 1.0; 
                    const y = (v - 1.0) * zoomXY * (canvas.height / 2) + (canvas.height / 2);

                    if (i === 0) {
                        canvasCtx.moveTo(x, y);
                    } else {
                        canvasCtx.lineTo(x, y);
                    }

                    x += sliceWidth;
                    if (x > canvas.width) break; 
                }

                canvasCtx.stroke();
            }
        }

        function draw() {
            if (isPaused) return; 
            requestAnimationFrame(draw);
            drawFrame();
        }
    </script>
</body>
</html>
